name: Build & Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          # We use nixos-unstable to get the latest tectonic and biber-for-tectonic
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build PDF via CI Nix file
        # nix-build looks for the file we just created
        run: nix-build docs/ci.nix -o result

      - name: Prepare Pages
        run: |
          mkdir -p public
          # Copy the generated PDF from the Nix result 
          cp result/main.pdf public/index.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
