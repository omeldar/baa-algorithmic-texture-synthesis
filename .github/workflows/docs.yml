name: Build & Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs/flake.nix"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docs/flake.nix"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Build PDF
        run: nix develop ./docs --command bash -lc "cd docs && make"

      - name: Prepare Pages content
        run: |
          mkdir -p public
          cp docs/*.pdf public/

          # simple index page
          echo "<meta http-equiv='refresh' content='0; url=$(basename docs/*.pdf)'>" > public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
